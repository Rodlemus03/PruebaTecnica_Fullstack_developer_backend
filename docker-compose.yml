services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: cfg_tickets
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cfg_tickets"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: cfg_tickets
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ${FRONTEND_CONTEXT:-https://github.com/Rodlemus03/PruebaTecnica_Fullstack_developer_frontend.git#main}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db-data:
